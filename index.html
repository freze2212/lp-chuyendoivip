<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hệ Thống Chuyển Đổi VIP</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/app.css?v=1" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>" />
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">
      <span class="brand-icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 10-12h-7z" fill="white"/></svg>
      </span>
      <span>
        <div class="brand-name">Hệ Thống Chuyển Đổi VIP</div>
        <div class="brand-sub">Secure Gateway v3.0</div>
      </span>
    </a>
    <div class="top-actions">
      <div class="user-chip"><i class="dot"></i><span id="user-chip">user</span></div>
      <button type="button" class="btn-history" id="btn-history">Lịch sử</button>
    </div>
  </header>

  <main class="stage">
    <form class="card" id="transfer-form" autocomplete="off">
      <div class="vip-badge" aria-hidden="true">👑</div>
      <h1>HỆ THỐNG CHUYỂN ĐỔI VIP</h1>
      <p class="lead">Nhập chính xác tên trang và tên tài khoản</p>

      <div class="field">
        <label>Tài khoản nguồn</label>
        <div class="row">
          <input class="input" id="from-user" type="text" placeholder="Tên tài khoản" maxlength="40" />
          <input class="input" id="from-site" type="text" placeholder="Tên trang" maxlength="30" />
        </div>
      </div>

      <div class="field">
        <label>Tài khoản đến</label>
        <div class="row">
          <input class="input" id="to-user" type="text" placeholder="Tên tài khoản" maxlength="40" />
          <input class="input" id="to-site" type="text" placeholder="Tên trang" maxlength="30" />
        </div>
      </div>

      <div class="field">
        <label>Xác thực bảo mật</label>
        <div id="turnstile" class="turnstile-box"></div>
      </div>

      <button class="submit" id="btn-submit" type="submit" disabled>CHUYỂN ĐỔI VIP</button>
      <div class="form-error" id="form-error"></div>
    </form>
  </main>

  <div class="ticker" aria-hidden="true"><div class="ticker-track" id="ticker"></div></div>

  <div class="overlay" id="overlay">
    <div class="modal" id="modal">
      <div class="spinner" id="modal-spinner"></div>
      <div class="result-icon" id="modal-icon"></div>
      <h2 id="modal-title"></h2>
      <p id="modal-text"></p>
      <div id="modal-extra"></div>
      <div class="modal-actions" id="modal-actions"></div>
    </div>
  </div>

  <aside class="panel" id="history-panel">
    <header><h2>Lịch sử chuyển đổi VIP</h2><button type="button" id="btn-close-history">×</button></header>
    <div class="list" id="history-list"></div>
  </aside>

  <script src="./assets/app.js?v=1"></script>
</body>
</html>
